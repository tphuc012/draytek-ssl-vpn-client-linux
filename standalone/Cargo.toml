[package]
name = "draytek-vpn"
version = "0.1.0"
edition = "2021"
description = "DrayTek SSL VPN client for Linux"
default-run = "draytek-vpn"

[[bin]]
name = "draytek-vpn"
path = "src/main.rs"

[dependencies]
# Shared NetworkManager observation — the app drives NM, it does not tunnel
draytek-vpn-nmapi = { path = "../nmapi" }
# UI
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_5"] }

# Async
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", features = ["tokio"] }

# Logging, utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
anyhow = "1"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }

[package.metadata.deb]
name = "draytek-vpn-standalone"
maintainer = "Julian"
section = "net"
priority = "optional"
depends = "libgtk-4-1, libadwaita-1-0"
assets = [
    ["target/release/draytek-vpn", "usr/bin/", "755"],
    ["data/draytek-vpn.desktop", "usr/share/applications/", "644"],
]
